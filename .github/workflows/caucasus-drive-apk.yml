# Сборка APK CAUCASUS DRIVE и публикация в GitHub Releases (скачать: вкладка Releases → «CAUCASUS DRIVE — последняя сборка»)
name: CAUCASUS DRIVE APK

on:
  push:
    branches: [ 'claude/autovaz-mobile-driving-sim-232iuq', main, master ]
    paths: [ 'caucasus-drive/**', '.github/workflows/caucasus-drive-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caucasus-drive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: caucasus-drive/package-lock.json

      - name: Веб-сборка (Three.js + модели)
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Сборка APK
        working-directory: caucasus-drive/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CaucasusDrive.apk

      - name: ZIP с исходниками и веб-версией
        run: |
          mkdir -p out
          cp CaucasusDrive.apk out/
          cp -r dist out/web
          cd .. && zip -qr caucasus-drive/out/CaucasusDrive-source.zip caucasus-drive \
            -x 'caucasus-drive/node_modules/*' 'caucasus-drive/dist/*' 'caucasus-drive/out/*' 'caucasus-drive/CaucasusDrive.apk' \
               'caucasus-drive/android/app/build/*' 'caucasus-drive/android/build/*' 'caucasus-drive/android/.gradle/*' 'caucasus-drive/android/.kotlin/*'
          ls -la caucasus-drive/out

      - uses: actions/upload-artifact@v4
        with:
          name: CaucasusDrive
          path: caucasus-drive/out/

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caucasus-drive-latest
          name: CAUCASUS DRIVE — последняя сборка
          prerelease: true
          make_latest: false
          body: |
            Автоматическая сборка из ветки ${{ github.ref_name }} (${{ github.sha }}).
            • CaucasusDrive.apk — установить на Android 7+ (разрешить установку из неизвестных источников)
            • CaucasusDrive-source.zip — исходники проекта (npm install → npm run build → android/gradlew assembleDebug)
          files: |
            caucasus-drive/CaucasusDrive.apk
            caucasus-drive/out/CaucasusDrive-source.zip
