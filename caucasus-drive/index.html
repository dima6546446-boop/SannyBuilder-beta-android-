<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>CAUCASUS DRIVE</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <!-- заставка: чёрный фон, название проявляется, пока грузятся модели -->
  <div id="intro">
    <div class="intro-title"><b>CAUCASUS</b> DRIVE</div>
    <div class="intro-sub">ГАРАЖ · ГОРОД · ЭКЗАМЕН ГИБДД</div>
    <div class="intro-bar"><i></i></div>
  </div>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>

  <!-- ===================== HUD ===================== -->
  <div id="hud" class="hidden">
    <div id="hud-tl">
      <canvas id="minimap" width="220" height="220"></canvas>
      <div id="indicators">
        <div id="ind-l" class="ibtn" data-ind="L"><svg viewBox="0 0 24 24"><path d="M14 5 6 12l8 7v-4h6V9h-6z"/></svg></div>
        <div id="hazard" class="ibtn"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20zm0 5 5.6 10H6.4z"/></svg></div>
        <div id="ind-r" class="ibtn" data-ind="R"><svg viewBox="0 0 24 24"><path d="M10 5l8 7-8 7v-4H4V9h6z"/></svg></div>
      </div>
    </div>

    <div id="hud-top">
      <div id="mission" class="hidden">
        <div id="mission-title"></div>
        <div id="mission-sub"></div>
        <div id="mission-bar"><i></i></div>
      </div>
      <div id="combo" class="hidden"></div>
      <div id="drift" class="hidden">
        <div class="dr-row"><span id="dr-pts">0</span><span id="dr-mult">×1</span></div>
        <div class="dr-row2"><span id="dr-ang">0°</span><div id="dr-bar"><i></i></div></div>
        <div id="dr-tag"></div>
      </div>
    </div>

    <div id="hud-tr">
      <div class="tr-row"><div id="speed-limit" class="hidden">60</div><div id="money-box"><span id="money">0</span> ₽</div></div>
      <div id="clock-row"><span id="clock">12:00</span> <span id="fps"></span></div>
      <div id="online-row" class="hidden"></div>
      <div class="btnrow">
        <div id="btn-cam" class="cbtn" title="Камера"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4zm8 3a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg></div>
        <div id="btn-lights" class="cbtn" title="Фары"><svg viewBox="0 0 24 24"><path d="M13 5c4 0 7 3 7 7s-3 7-7 7h-2V5zM2 7h7v2H2zm0 4h7v2H2zm0 4h7v2H2z"/></svg></div>
        <div id="btn-radio" class="cbtn" title="Радио (M)"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4zm2 2v8h6v-8zm9 1a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM7 3l11 4H6z"/></svg></div>
        <div id="btn-door" class="cbtn hidden" title="Выйти из машины (G)"><svg viewBox="0 0 24 24"><path d="M4 3h10v4h-2V5H6v14h6v-2h2v4H4zm11 4 5 5-5 5v-3H9v-4h6z"/></svg></div>
        <div id="btn-chat" class="cbtn hidden" title="Фразы"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4zm4 5v2h2V9zm4 0v2h2V9zm4 0v2h2V9z"/></svg></div>
        <div id="btn-pause" class="cbtn" title="Пауза"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></div>
      </div>
    </div>

    <div id="nav"><div id="nav-arrow"></div><div id="nav-dist"></div></div>

    <div id="sensors" class="hidden">
      <div id="sensor-f" class="sensor"><i></i><i></i><i></i><i></i></div>
      <div id="sensor-r" class="sensor"><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="dash">
      <div id="dash-ind-l" class="dind">◀</div>
      <div id="dash-main">
        <div id="spd">0</div>
        <div class="unit">км/ч</div>
      </div>
      <div id="dash-side">
        <div id="gear">D1</div>
        <div id="fuel"><i></i></div>
      </div>
      <div id="dash-ind-r" class="dind">▶</div>
      <div id="rpmbar"><i></i></div>
    </div>
  </div>

  <!-- ===================== УПРАВЛЕНИЕ ===================== -->
  <div id="controls" class="hidden">
    <div id="wheel">
      <svg id="wheel-inner" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="wg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#111"/></radialGradient>
        </defs>
        <circle cx="100" cy="100" r="86" fill="none" stroke="url(#wg)" stroke-width="20" />
        <circle cx="100" cy="100" r="86" fill="none" stroke="#555" stroke-width="2" />
        <path d="M18 106 L76 110 L100 142 L124 110 L182 106" fill="none" stroke="#1d1d1d" stroke-width="16" stroke-linejoin="round" />
        <circle cx="100" cy="112" r="24" fill="#1a1a1a" stroke="#666" stroke-width="3" />
        <path d="M86 118 L100 100 L114 118 Z" fill="none" stroke="#c9c9c9" stroke-width="3"/>
        <rect x="95" y="4" width="10" height="20" rx="2" fill="#e53" />
      </svg>
    </div>
    <div id="arrows" class="hidden">
      <div id="arrow-l" class="abtn"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></div>
      <div id="arrow-r" class="abtn"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8z"/></svg></div>
    </div>

    <div id="right-cluster">
      <div id="mini">
        <div id="btn-horn" class="cbtn" title="Гудок"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></div>
        <div id="btn-taxi" class="cbtn hidden" title="Такси"><svg viewBox="0 0 24 24"><path d="M8 3h8l1 3h2a2 2 0 0 1 2 2v8h-2a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H3V8a2 2 0 0 1 2-2h2zm1.4 3h5.2l-.4-1.2H9.8zM5 9v3h14V9z"/></svg></div>
      </div>
      <div id="hb" class="hbtn">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 3a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-1 2v8h2V8z"/></svg>
        <span>РУЧНИК</span>
      </div>
      <div id="lever">
        <div class="lslot" data-sel="R">R</div>
        <div class="lslot" data-sel="N">N</div>
        <div class="lslot sel" data-sel="D">D</div>
      </div>
      <div id="shifter" class="hidden">
        <div id="shift-up" class="sbtn">+</div>
        <div id="shift-gear">1</div>
        <div id="shift-down" class="sbtn">−</div>
      </div>
      <div id="brake" class="pedal"><div class="tread"></div><span>ТОРМОЗ</span></div>
      <div id="gas" class="pedal"><div class="tread"></div><span>ГАЗ</span></div>
    </div>

    <div id="btn-action" class="actbtn hidden">ДЕЙСТВИЕ</div>

    <!-- пешком -->
    <div id="foot">
      <div id="stick"><div id="stick-knob"></div></div>
      <div id="btn-enter" class="actbtn hidden">СЕСТЬ В МАШИНУ</div>
      <div id="btn-shop" class="actbtn hidden">МАГАЗИН</div>
      <div id="foot-btns">
        <div id="btn-smoke" class="fbtn" title="Курить (K)"><svg viewBox="0 0 24 24"><path d="M2 15h14v3H2zm15 0h1.6v3H17zm2.4 0H21v3h-1.6zM16.9 4.6c-.6.9-.4 2 .5 2.7 1.4 1 1.7 2.8.8 4.2l1.3.9c1.4-2.1.9-4.8-1.2-6.3-.3-.2-.4-.7-.1-1zm3 .2c-.6.9-.4 2 .5 2.7 1 .7 1.2 2 .6 3l1.3.9c1.1-1.7.7-3.9-1-5.1-.3-.2-.4-.7-.1-1z"/></svg><span>КУРИТЬ</span></div>
        <div id="btn-whistle" class="fbtn" title="Свист (R)"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg><span>СВИСТ</span></div>
        <div id="btn-sit" class="fbtn" title="Сесть (B)"><svg viewBox="0 0 24 24"><path d="M7 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm-1 5h3l2 6h6v2h-4l1 5h-2l-1.6-5H7.5L5 9zM14 9h7v2h-7z"/></svg><span>СЕСТЬ</span></div>
        <div id="btn-jump" class="fbtn big" title="Прыжок (Пробел)"><svg viewBox="0 0 24 24"><path d="M12 3 5 10h4v5h6v-5h4zM5 18h14v3H5z"/></svg><span>ПРЫЖОК</span></div>
      </div>
    </div>
  </div>

  <!-- ===================== МЕНЮ (строится в Menus.js) ===================== -->
  <div id="ui"></div>
  <div id="toasts"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
